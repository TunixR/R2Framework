# Every label of the repository. workflows/labels.yml syncs this file to GitHub on push to
# develop: labels are created, updated, renamed (`from_name`) and labels missing here are DELETED.
# `area:` labels must match the keys of labeler.yml (a unit test checks). See CONTRIBUTING.md.

# What kind of change: one per issue/PR. Issue forms and PR titles apply it automatically.
- name: "type: bug"
  color: "#d73a4a"
  description: "Something isn't working (fix)"
  from_name: "bug"
- name: "type: feature"
  color: "#d73a4a"
  description: "New feature or requirement (feat)"
  from_name: "enhancement"
- name: "type: refactor"
  color: "#d73a4a"
  description: "Restructuring without behaviour change (refactor)"
- name: "type: docs"
  color: "#d73a4a"
  description: "Documentation only (docs)"
  from_name: "documentation"
- name: "type: test"
  color: "#d73a4a"
  description: "Tests only (test)"
- name: "type: chore"
  color: "#d73a4a"
  description: "Build, CI, tooling, dependencies (build, ci, chore, revert)"
- name: "type: perf"
  color: "#d73a4a"
  description: "Performance improvement (perf)"
- name: "type: security"
  color: "#d73a4a"
  description: "Security fix or vulnerability (applied by hand)"

# Which part of the system: applied from changed files (PRs) and mentioned paths (issues).
- name: "area: recovery"
  color: "#1d76db"
  description: "Recovery lifecycle and WS protocol"
- name: "area: agents"
  color: "#1d76db"
  description: "Agent model, gateway, error agent, sub-agents, prompts"
- name: "area: gui-agent"
  color: "#1d76db"
  description: "GUI agents (Tooled GUI, UI-TARS) and their action set"
- name: "area: tools"
  color: "#1d76db"
  description: "Strands tools, hooks, call limits"
- name: "area: providers"
  color: "#1d76db"
  description: "LLM provider routers and backbones"
- name: "area: auth"
  color: "#1d76db"
  description: "Users, roles, sessions, robot keys"
- name: "area: tracing"
  color: "#1d76db"
  description: "Per-recovery trace logging and S3 artifacts"
- name: "area: observability"
  color: "#1d76db"
  description: "OpenTelemetry and SigNoz"
- name: "area: db"
  color: "#1d76db"
  description: "Engine, migrations, seed data"
- name: "area: api"
  color: "#1d76db"
  description: "CRUD routers (agents, tools, provider, keys, logging)"
- name: "area: evals"
  color: "#1d76db"
  description: "Evaluations and experiments"
- name: "area: ws-client"
  color: "#1d76db"
  description: "Robot-side recovery WS test client"
- name: "area: docker"
  color: "#1d76db"
  description: "Docker services and deployment"
- name: "area: ci"
  color: "#1d76db"
  description: "GitHub workflows, pre-commit, repo conventions"

- name: "priority: high"
  color: "#b60205"
  description: "Do this first (unlabeled = normal)"
- name: "priority: low"
  color: "#c5def5"
  description: "Nice to have"

- name: "status: blocked"
  color: "#fbca04"
  description: "Waiting on something else"
- name: "status: needs-info"
  color: "#fbca04"
  description: "More information is needed before work can start"
- name: "status: needs-design"
  color: "#fbca04"
  description: "Needs a design doc before implementation"

- name: "breaking"
  color: "#000000"
  description: "Breaks the WS protocol, robot contract, DB schema or env vars"
- name: "dependencies"
  color: "#0366d6"
  description: "Dependency updates (deps)"

# GitHub defaults kept as they are.
- name: "good first issue"
  color: "#7057ff"
  description: "Good for newcomers"
- name: "help wanted"
  color: "#008672"
  description: "Extra attention is needed"
- name: "duplicate"
  color: "#cfd3d7"
  description: "This issue or pull request already exists"
- name: "invalid"
  color: "#e4e669"
  description: "This doesn't seem right"
- name: "wontfix"
  color: "#ffffff"
  description: "This will not be worked on"
- name: "question"
  color: "#d876e3"
  description: "Further information is requested"
