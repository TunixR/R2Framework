# The single dependency bot (Renovate was configured but never ran on this repo).
# PR titles follow CONTRIBUTING.md: `chore(deps): ...`, labelled `dependencies`.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR a week for minor/patch bumps; majors stay one PR each so they can be reviewed.
      uv:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]
