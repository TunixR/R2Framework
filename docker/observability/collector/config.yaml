# SigNoz OTLP ingest collector (signoz/signoz-otel-collector).
# Based on SigNoz Foundry's generated ingester config for collector v0.144.x.
# SigNoz pushes log pipelines and span/LLM mappings over OpAMP (opamp.yaml).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

connectors:
  signozmeter:
    metrics_flush_interval: 1h
    dimensions:
      - name: service.name
      - name: deployment.environment
      - name: host.name

processors:
  batch:
    send_batch_size: 50000
    send_batch_max_size: 55000
    timeout: 5s
  batch/meter:
    send_batch_size: 20000
    send_batch_max_size: 25000
    timeout: 5s
  filter/drop_stale:
    error_mode: ignore
    logs:
      log_record:
        - time_unix_nano != 0 and time < Now() - Duration("360h")
        - time_unix_nano == 0 and observed_time_unix_nano != 0 and observed_time < Now() - Duration("360h")
    metrics:
      datapoint:
        - time_unix_nano != 0 and time < Now() - Duration("360h")
    traces:
      span:
        - start_time_unix_nano != 0 and start_time < Now() - Duration("360h")
  # SigNoz's logs schema (signoz_logs.logs_v2) has no column for the OTLP
  # LogRecord `event_name` field yet (https://github.com/SigNoz/signoz/issues/8140)
  # and drops it. Keep it queryable as the `event.name` attribute until it does.
  transform/event_name:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(log.attributes["event.name"], log.event_name) where log.event_name != "" and log.attributes["event.name"] == nil
  signozlogsnormalizer: {}
  signozspanmapper:
    groups: []
  signozllmpricing:
    attrs:
      model: gen_ai.request.model
      in: gen_ai.usage.input_tokens
      out: gen_ai.usage.output_tokens
      cache_read: gen_ai.usage.cache_read.input_tokens
      cache_write: gen_ai.usage.cache_creation.input_tokens
    default_pricing:
      rules: []
    output_attrs:
      in: signoz.gen_ai.usage.input_tokens.cost
      out: signoz.gen_ai.usage.output_tokens.cost
      cache_read: signoz.gen_ai.usage.cache_read.input_tokens.cost
      cache_write: signoz.gen_ai.usage.cache_write.input_tokens.cost
      total: signoz.gen_ai.usage.tokens.cost
  signozspanmetrics/delta:
    metrics_exporter: signozclickhousemetrics
    metrics_flush_interval: 60s
    aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
    enable_exp_histogram: true
    dimensions_cache_size: 100000
    latency_histogram_buckets: [100us, 1ms, 2ms, 6ms, 10ms, 50ms, 100ms, 250ms, 500ms, 1000ms, 1400ms, 2000ms, 5s, 10s, 20s, 40s, 60s]
    dimensions:
      - name: service.namespace
        default: default
      - name: deployment.environment
        default: default
      - name: signoz.collector.id
      - name: service.version

exporters:
  clickhousetraces:
    datasource: ${env:SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN}/signoz_traces
    low_cardinal_exception_grouping: ${env:LOW_CARDINAL_EXCEPTION_GROUPING}
    use_new_schema: true
    timeout: 45s
    sending_queue:
      enabled: false
  clickhouselogsexporter:
    dsn: ${env:SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN}/signoz_logs
    use_new_schema: true
    timeout: 45s
    sending_queue:
      enabled: false
  signozclickhousemetrics:
    dsn: ${env:SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN}/signoz_metrics
    timeout: 45s
    sending_queue:
      enabled: false
  signozclickhousemeter:
    dsn: ${env:SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN}/signoz_meter
    timeout: 45s
    sending_queue:
      enabled: false
  metadataexporter:
    dsn: ${env:SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN}/signoz_metadata
    enabled: true
    timeout: 45s
    cache:
      provider: in_memory

extensions:
  signoz_health_check:
    endpoint: 0.0.0.0:13133

service:
  telemetry:
    logs:
      encoding: json
  extensions: [signoz_health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [signozspanmetrics/delta, signozspanmapper, signozllmpricing, filter/drop_stale, batch]
      exporters: [clickhousetraces, signozmeter, metadataexporter]
    metrics:
      receivers: [otlp]
      processors: [filter/drop_stale, batch]
      exporters: [signozclickhousemetrics, signozmeter, metadataexporter]
    logs:
      receivers: [otlp]
      processors: [transform/event_name, signozlogsnormalizer, filter/drop_stale, batch]
      exporters: [clickhouselogsexporter, signozmeter, metadataexporter]
    metrics/meter:
      receivers: [signozmeter]
      processors: [batch/meter]
      exporters: [signozclickhousemeter]
