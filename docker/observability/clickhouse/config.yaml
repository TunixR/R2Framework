# ClickHouse server config for SigNoz (single shard, single replica).
# Based on SigNoz Foundry's generated config.
display_name: cluster
listen_host: 0.0.0.0
http_port: 8123
tcp_port: 9000
interserver_http_port: 9009

path: /var/lib/clickhouse/
tmp_path: /var/lib/clickhouse/tmp/
user_files_path: /var/lib/clickhouse/user_files/
user_scripts_path: /var/lib/clickhouse/user_scripts/
format_schema_path: /var/lib/clickhouse/format_schemas/
dictionaries_config: "*_dictionary.xml"
user_defined_executable_functions_config: "*functions.yaml"

logger:
  console: 1
  level: warning
  formatting:
    type: console

macros:
  shard: "00"
  replica: "00"

remote_servers:
  cluster:
    shard:
      - replica:
          - host: signoz-clickhouse
            port: 9000
            # Distributed tables query the replica as this user.
            user: default
            password:
              "@from_env": CLICKHOUSE_PASSWORD

# ClickHouse Keeper speaks the ZooKeeper protocol.
zookeeper:
  node:
    - host: signoz-keeper
      port: 9181

distributed_ddl:
  path: /clickhouse/task_queue/ddl

user_directories:
  users_xml:
    path: config.yaml

profiles:
  default:
    load_balancing: random
    log_queries: 1

users:
  default:
    # From the container's CLICKHOUSE_PASSWORD (SIGNOZ_CLICKHOUSE_PASSWORD in
    # docker/.env). ClickHouse is also never published outside the telemetry network.
    password:
      "@from_env": CLICKHOUSE_PASSWORD
    networks:
      ip: ::/0
    profile: default
    quota: default
    access_management: 1
    named_collection_control: 1
    show_named_collection: 1
    show_named_collection_secrets: 1

quotas:
  default:
    interval:
      duration: 3600
      queries: 0
      errors: 0
      result_rows: 0
      read_rows: 0
      execution_time: 0

# Keep ClickHouse's own system logs short-lived.
query_log:
  partition_by: toYYYYMM(event_date)
  flush_interval_milliseconds: 30000
  ttl: event_date + INTERVAL 1 DAY DELETE
query_thread_log:
  ttl: event_date + INTERVAL 1 DAY DELETE
query_views_log:
  ttl: event_date + INTERVAL 1 DAY DELETE
query_metric_log:
  ttl: event_date + INTERVAL 1 DAY DELETE
part_log:
  ttl: event_date + INTERVAL 1 DAY DELETE
trace_log:
  flush_interval_milliseconds: 30000
  ttl: event_date + INTERVAL 1 DAY DELETE
text_log:
  flush_interval_milliseconds: 30000
  ttl: event_date + INTERVAL 1 DAY DELETE
metric_log:
  flush_interval_milliseconds: 30000
  ttl: event_date + INTERVAL 1 DAY DELETE
asynchronous_metric_log:
  ttl: event_date + INTERVAL 1 DAY DELETE
latency_log:
  ttl: event_date + INTERVAL 1 DAY DELETE
error_log:
  ttl: event_date + INTERVAL 1 DAY DELETE
session_log:
  ttl: event_date + INTERVAL 1 DAY DELETE
processors_profile_log:
  flush_interval_milliseconds: 30000
  ttl: event_date + INTERVAL 1 DAY DELETE
zookeeper_log:
  ttl: event_date + INTERVAL 1 DAY DELETE
